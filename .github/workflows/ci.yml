name: ci

on:
  pull_request:
    branches: [main]
  # TEMPORARY: runs CI on pushes to this branch for testing. Remove before merging to main.
  push:
    branches: [v0.2.0-ci]

permissions:
  contents: read
  packages: write

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          imageName: ghcr.io/${{ github.repository_owner }}/flight-devcontainer
          cacheFrom: ghcr.io/${{ github.repository_owner }}/flight-devcontainer
          # Only the unit test job pushes the image, so the two jobs never push the same tag.
          push: never
          runCmd: make analyze

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          imageName: ghcr.io/${{ github.repository_owner }}/flight-devcontainer
          cacheFrom: ghcr.io/${{ github.repository_owner }}/flight-devcontainer
          # Pushing after every successful run refreshes the image cache for the next run.
          push: always
          runCmd: make test
